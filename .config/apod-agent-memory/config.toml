# APOD agent memory local collector config.
# Generated by apod-memory config wizard. Review before running ingest.

actor = "cory.hernandez"
team = "APOD"
default_visibility = "private"
repo_path = "/Users/cory.hernandez/code/apod/apod-agent-memory"
repo_allowlist = [
  "apod_infra",
  "apod_layers",
  "apod_ui",
  "apod_provisioning",
  "apod_infra_drivers",
  "apod_documentation",
  "apod-agent-memory",
]
output_dir = "memory/runs/inbox/cory.hernandez"
state_file = "~/.local/state/apod-agent-memory/cory.hernandez-ingest-state.json"
raw_transcript_policy = "local_only"

[git]
push = false
branch_prefix = "memory/ingest"
commit_message = "Ingest cory.hernandez agent transcripts"

[git.review]
branch_prefix = "memory"
remote = "origin"
target_branch = "main"
push = false
create_mr = false
commit_message = "Promote accepted APOD memory proposal"

[ingest]
replace_changed_sources = true
exclude_content_patterns = [
  "monitor-apod-memory-launchagent-usefulness",
]

[redaction]
redact_before_write = true
include_source_paths = false

[[transcript_source]]
provider = "codex"
paths = [
  "/Users/cory.hernandez/.codex/sessions/**/*.jsonl",
]

[[transcript_source]]
provider = "anthropic"
paths = []

[[transcript_source]]
provider = "openai"
paths = []

[[transcript_source]]
provider = "google"
paths = []

[[transcript_source]]
provider = "generic"
paths = []
